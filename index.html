<style>

.ctl{display:flex;gap:4px;align-items:center;flex-wrap:wrap}

.kpi{min-width:150px}.kpi .big{font-size:38px;margin-top:2px}

#side .big{font-size:30px;margin:4px 0 8px}
.r{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--ln)}.r b{color:var(--v);font-weight:600}

#tb{position:relative;height:6px;background:#1a2027;margin:6px 10px 18px}#tf{height:100%;background:var(--v);width:0}

.mk.a span{color:var(--v)}.mk.a i{background:var(--v)}

@media(max-width:780px){#ai{display:none}#RC{top:auto;bottom:96px;left:12px;right:12px;width:auto;max-height:30vh}.kpi{min-width:0;flex:1}.kpi .big{font-size:28px}}

{const mk=new THREE.InstancedMesh(BX(1,.04,1),BM(0xc9c9a8),150+116);let mi=0;for(let k=0;k<150;k++){const th=f2th((k+.25)/150),p=pt(th,101),n=pt(th,102).sub(pt(th,100));dm.position.set(p.x,.07,p.z);dm.rotation.set(0,Math.atan2(-n.x,-n.z),0);dm.scale.set(4,1,.25);dm.updateMatrix();mk.setMatrixAt(mi++,dm.matrix)}
